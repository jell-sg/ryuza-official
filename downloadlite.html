<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skin Replace MLBB</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#121a2b;--line:#26334b;--accent:#ed334d;--text:#f4f6fb;--muted:#9eabc2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182642 0,#090d18 48%);font-family:Arial,sans-serif;color:var(--text)}
header{padding:28px 18px 20px;text-align:center}h1{margin:0;font-size:27px;letter-spacing:.5px}header p{margin:8px 0 0;color:var(--muted);font-size:13px}
main{max-width:1250px;margin:auto;padding:0 16px 40px}.tools{display:flex;gap:10px;margin:8px 0 18px;flex-wrap:wrap}
input{flex:1;min-width:220px;background:#111a2b;color:white;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:14px;outline:none}
#count{color:var(--muted);font-size:12px;align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:linear-gradient(160deg,#172238,#101726);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0;box-shadow:0 8px 24px #0003}
.cover{height:190px;background:#080d17;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.info{padding:12px}.name{font-weight:700;font-size:14px;min-height:34px;line-height:1.3;margin-bottom:10px}
select{width:100%;background:#0b1220;color:#fff;border:1px solid #34435d;border-radius:8px;padding:10px;font-size:12px;margin-bottom:9px}
.go{display:block;text-align:center;background:linear-gradient(90deg,#e52c4a,#b91e39);color:white;text-decoration:none;padding:10px;border-radius:8px;font-size:12px;font-weight:700}
.go:hover{filter:brightness(1.12)}.empty{display:none;text-align:center;color:var(--muted);padding:35px}
footer{text-align:center;color:#73819b;font-size:11px;padding:25px}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cover{height:155px}.info{padding:9px}.name{font-size:12px}}
</style>
</head>
<body>

const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty');
function render(){
 const q=search.value.trim().toLowerCase();
 const filtered=skins.filter(s=>s.title.toLowerCase().includes(q));
 grid.innerHTML=filtered.map((s,i)=>{
  const selected=Math.max(0,s.options.findIndex(o=>o.selected));
  const options=s.options.map((o,j)=>`<option value="${j}" ${j===selected?'selected':''}>${escapeHtml(o.name)}${o.selected?' (Terpilih)':''}</option>`).join('');
  return `<article class="card">
   <div class="cover"><img src="${escapeAttr(s.image)}" alt="${escapeAttr(s.title)}" loading="lazy" onerror="this.style.display='none'"></div>
   <div class="info"><div class="name">${escapeHtml(s.title)}</div>
   <select aria-label="Pilih replace untuk ${escapeAttr(s.title)}" data-skin="${skins.indexOf(s)}">${options}</select>
   <a class="go" href="${escapeAttr(s.options[selected]?.url||'#')}" target="_blank" rel="noopener noreferrer">DOWNLOAD REPLACE</a>
   </div></article>`;
 }).join('');
 count.textContent=`${filtered.length} / ${skins.length} skin`;
 empty.style.display=filtered.length?'none':'block';
 grid.querySelectorAll('select').forEach(sel=>sel.addEventListener('change',()=>{
   const s=skins[Number(sel.dataset.skin)],url=s.options[Number(sel.value)]?.url;
   sel.nextElementSibling.href=url||'#';
 }));
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(v){return escapeHtml(v);}
search.addEventListener('input',render);render();
</script>
