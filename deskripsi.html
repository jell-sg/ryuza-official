function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Teks berhasil disalin')}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Teks berhasil disalin')}catch(_){toast('Gagal menyalin teks')}ta.remove()}}
function addCopyButton(parent,label,text){
 const button=document.createElement('button');
 button.textContent=label;
 button.type='button';
 button.setAttribute('aria-label',label);
 button.addEventListener('click',()=>copyText(text));
 parent.append(button);
}
function splitEntry(item){
 // Gunakan pemisahan khusus Chou KOF jika sudah tersedia di data asli.
 if((item.title||'').trim().toLowerCase()==='chou kof' && Array.isArray(item.sections)){
   return [
     {title:'BIO',text:item.sections[0]?.text||''},
     {title:'LINK DOWNLOAD',text:item.sections[1]?.text||''}
   ].filter(x=>x.text.trim());
 }
 const raw=item.text||'';
 const downloadAt=raw.search(/📌\s*Script Skin/i);
 if(downloadAt<0) return [{title:'BIO',text:raw.trim()}];
 // Bagian download berakhir sebelum Credits atau Tags; konten lain tetap masuk BIO.
 const after=raw.slice(downloadAt);
 const endMatch=after.match(/\n\s*(?:={5,}\s*\n)?(?:Credits\s*:|Tags\s*\(ignore\)\s*:)/i);
 const endAt=endMatch ? endMatch.index : after.length;
 const download=after.slice(0,endAt).replace(/\n?\s*={5,}\s*$/,'').trim();
 let bio=(raw.slice(0,downloadAt)+'\n'+after.slice(endAt)).trim();
 // Rapikan garis pemisah berulang yang tertinggal setelah link dipindahkan.
 bio=bio.replace(/(?:\n\s*={5,}\s*){2,}/g,'\n==================================================\n')
        .replace(/^\s*={5,}\s*$/gm,'==================================================')
        .replace(/\n{3,}/g,'\n\n').trim();
 return [
   {title:'BIO',text:bio},
   {title:'LINK DOWNLOAD',text:download}
 ].filter(x=>x.text.trim());
}
function render(){
 const q=search.value.trim().toLowerCase();
 const filtered=entries.filter(x=>(x.title+' '+x.text).toLowerCase().includes(q));
 list.innerHTML='';count.innerHTML='<span>Menampilkan <strong>'+filtered.length+'</strong> dari <strong>'+entries.length+'</strong> skin</span><span>✦ '+(q?'Hasil pencarian':'Semua koleksi')+'</span>';
 empty.style.display=filtered.length?'none':'block';
 for(const item of filtered){
   const sections=splitEntry(item);
   const group=document.createElement('section');group.className='bio-group';
   const card=document.createElement('article');card.className='card';
   const body=document.createElement('div');body.className='cardbody';
   const img=document.createElement('img');img.className='thumb';img.loading='lazy';img.alt=item.title;
   const imageUrl=imageMap[item.title];
   if(imageUrl){img.src=imageUrl;img.onerror=()=>{img.removeAttribute('src');img.classList.add('thumb-fallback');img.alt='✦';img.style.display='none';};}
   else {img.style.display='none';}
   const content=document.createElement('div');content.className='cardcontent';
   const title=document.createElement('h2');title.textContent=item.title;
   const actions=document.createElement('div');actions.className='actions';
   // Gabungkan BIO dan LINK DOWNLOAD menjadi satu teks utuh seperti format deskripsi contoh.
   const combinedText = (item.text && item.text.trim())
     ? item.text.trim()
     : sections.map(x=>x.text).filter(Boolean).join('\\n\\n').trim();
   if(combinedText)addCopyButton(actions,'Salin BIO + LINK',combinedText);
   content.append(title,actions);
   body.append(img,content);card.append(body);group.append(card);list.append(group);
 }
}
search.addEventListener('input',render);
render();
</script></body></html>
