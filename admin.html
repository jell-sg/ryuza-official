<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ryuza Admin • Skin Manager</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101c;color:#eef5ff;font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;background:#10253b}.ok{color:#75f0a5}.err{color:#ff8e8e}.card{background:#0d1928;border:1px solid #20344c;border-radius:14px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.skin{border:1px solid #263d56;border-radius:12px;padding:14px;background:#0a1523}.title{font-weight:800;margin-bottom:10px}.row{display:flex;gap:7px;margin:7px 0}.row input{flex:1;min-width:0}input{width:100%;padding:10px;border-radius:8px;border:1px solid #334b65;background:#07111d;color:#fff}button{border:0;border-radius:8px;padding:9px 12px;background:#1769aa;color:white;font-weight:700;cursor:pointer}button.danger{background:#a83232}button.secondary{background:#25384d}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#91a4b8}.search{margin-top:12px}.status{margin-top:10px}.small{font-size:12px}.loading{text-align:center;padding:30px}.add{margin-top:10px}
</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Ryuza Admin Panel</h1><div class="muted">Firebase Realtime Database • Skin / Replace Manager</div></div><div id="status" class="badge">Menghubungkan...</div></div><div class="card"><div class="actions"><button id="seedBtn">🔄 Ambil 175 Skin dari index.html</button><button id="pickBtn" class="secondary">📁 Pilih index.html dari komputer</button><input id="fileInput" type="file" accept=".html,text/html" style="display:none"><button id="addBtn" class="secondary">＋ Tambah Skin</button></div><div class="muted small" style="margin-top:9px">Data disimpan di <b>siteConfig/skins</b>. Setelah tersimpan, perubahan akan tampil realtime di halaman member.</div><input id="search" class="search" placeholder="Cari skin..."></div><div id="list" class="grid"><div class="loading">Memuat database...</div></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>
const CFG={authDomain:'ryuza-official.firebaseapp.com',databaseURL:'https://ryuza-official-default-rtdb.firebaseio.com',projectId:'ryuza-official'};
let app,db,items={};
try{app=firebase.initializeApp(CFG,'ryuza-admin-'+Math.random().toString(36).slice(2));db=app.database();}catch(e){document.getElementById('status').textContent='Firebase error';document.getElementById('status').className='badge err';console.error(e)}
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));}
function render(){const q=$('search').value.toLowerCase();const arr=Object.entries(items).filter(([id,x])=>!q||(x.title||'').toLowerCase().includes(q));$('list').innerHTML=arr.map(([id,x])=>`<div class="skin" data-id="${esc(id)}"><div class="title">${esc(x.title||id)}</div><input class="titleInput" value="${esc(x.title||'')}"><div class="options">${(x.options||[]).map((o,i)=>`<div class="row"><input class="label" value="${esc(o.label||'')}" placeholder="Nama Replace"><input class="url" value="${esc(o.url||'')}" placeholder="https://..."><button class="delOpt danger" data-i="${i}">×</button></div>`).join('')}</div><div class="actions add"><button class="addOpt secondary">＋ Replace</button><button class="save">💾 Simpan</button><button class="delSkin danger">Hapus</button></div></div>`).join('')||'<div class="card">Tidak ada data.</div>';bind();}
function bind(){document.querySelectorAll('.skin').forEach(card=>{const id=card.dataset.id;card.querySelector('.addOpt').onclick=()=>{items[id].options=items[id].options||[];items[id].options.push({label:'Replace Baru',url:'',selected:false});render()};card.querySelectorAll('.delOpt').forEach(b=>b.onclick=()=>{items[id].options.splice(+b.dataset.i,1);render()});card.querySelector('.save').onclick=async()=>{const btn=card.querySelector('.save');const x={...(items[id]||{}),id};x.title=card.querySelector('.titleInput').value.trim()||id;x.options=[...card.querySelectorAll('.row')].map(r=>({label:r.querySelector('.label').value.trim(),url:r.querySelector('.url').value.trim(),selected:false}));if(x.options[0])x.options[0].selected=true;try{btn.disabled=true;btn.textContent='⏳ Menyimpan...';await db.ref('siteConfig/skins/'+id).set(x);items[id]=x;btn.textContent='✅ Tersimpan realtime';setTimeout(()=>{if(btn)btn.textContent='💾 Simpan'},1200)}catch(err){console.error(err);btn.textContent='❌ Gagal: '+(err.code||'error');alert('Gagal menyimpan ke Firebase: '+err.message)}finally{btn.disabled=false}};card.querySelector('.delSkin').onclick=async()=>{if(confirm('Hapus skin ini dari database?'))await db.ref('siteConfig/skins/'+id).remove();};});}
$('search').oninput=render;
$('addBtn').onclick=()=>{const id='skin-'+Date.now();items[id]={id,title:'Skin Baru',options:[{label:'Default',url:'',selected:true}],order:Object.keys(items).length};render();};
db.ref('siteConfig/skins').on('value',s=>{items=s.val()||{};$('status').textContent='● REALTIME AKTIF';$('status').className='badge ok';render();},e=>{$('status').textContent='Firebase gagal: '+e.message;$('status').className='badge err';});
async function importIndexText(txt){if(Object.keys(items).length && !confirm('Database sudah berisi data. Timpa dengan data dari index.html?'))return false;const doc=new DOMParser().parseFromString(txt,'text/html');const out={};doc.querySelectorAll('.skin').forEach((c,i)=>{const title=c.querySelector('.hero-title-text')?.textContent.trim()||c.querySelector('.title')?.textContent.trim()||('Skin '+(i+1));const icon=c.querySelector('.hero-icon');let id=title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,100)||('skin-'+(i+1));if(out[id])id+='-'+i;out[id]={id,title,hero:icon?.dataset.hero||'',icon:icon?.src||'',options:[...c.querySelectorAll('.replace-select option')].map(o=>({label:o.dataset.label||o.textContent.trim(),url:o.value,selected:o.hasAttribute('selected')})),order:i};});if(!Object.keys(out).length)throw Error('Tidak menemukan .skin di index.html');await db.ref('siteConfig/skins').set(out);alert('Berhasil memasukkan '+Object.keys(out).length+' skin ke Firebase.');return true;}
$('seedBtn').onclick=async()=>{try{$('seedBtn').disabled=true;$('seedBtn').textContent='Mengambil...';const res=await fetch('./index.html?seed='+Date.now());if(!res.ok)throw Error('index.html tidak bisa dibaca');await importIndexText(await res.text());}catch(e){console.error(e);if(location.protocol==='file:'){$('fileInput').click();}else alert('Gagal: '+e.message)}finally{$('seedBtn').disabled=false;$('seedBtn').textContent='🔄 Ambil 175 Skin dari index.html';}};
$('pickBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const txt=await f.text();await importIndexText(txt);}catch(err){alert('Gagal membaca index.html: '+err.message)}e.target.value='';};
</script></body></html>
