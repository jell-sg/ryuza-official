const $=id=>document.getElementById(id), toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
const slug=x=>String(x||'').replace(/📌|🆕|BARU|No Password/gi,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,100);
async function get(path){const r=await fetch(DB+'/'+path+'.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
async function put(path,data){const r=await fetch(DB+'/'+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
async function patch(path,data){const r=await fetch(DB+'/'+path+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
async function load(){try{const c=await get('siteConfig');if(c&&c.skins){config={skins:c.skins||{},settings:{...defaults,...(c.settings||{})}}}else{config={skins:Object.fromEntries(seed.map(x=>[x.id,x])),settings:{...defaults}};await put('siteConfig',config);toast('Konfigurasi awal berhasil dibuat.')}await render();loadClicks()}catch(e){console.error(e);toast('Gagal membaca Firebase: '+e.message)}}
function render(){const arr=Object.values(config.skins).sort((a,b)=>a.name.localeCompare(b.name));$('statSkins').textContent=arr.length;$('statActive').textContent=arr.filter(x=>x.active!==false).length;$('statReplace').textContent=arr.reduce((n,x)=>n+(x.replaces||[]).length,0);const q=$('search').value.toLowerCase();$('skinList').innerHTML='';arr.filter(x=>!q||x.name.toLowerCase().includes(q)).forEach(x=>{const d=document.createElement('div');d.className='skin';d.innerHTML=`<div class="skin-head"><img src="${x.icon||''}" onerror="this.style.visibility='hidden'"><div style="flex:1"><div class="skin-name">${esc(x.name)} ${x.new?'<span style="color:#42a5ff">BARU</span>':''}</div><small>${(x.replaces||[]).length} Replace • ${x.active!==false?'Aktif':'Nonaktif'}</small></div><button class="primary">EDIT</button></div>`;d.querySelector('button').onclick=()=>edit(x.id);$('skinList').appendChild(d)})}
function edit(id){selected=id;const x=config.skins[id];$('editor').innerHTML=`<h2 style="margin-top:0">✏️ ${esc(x.name)}</h2><div class="form"><input class="input" id="eName" value="${escAttr(x.name)}"><input class="input" id="eHero" value="${escAttr(x.hero||'')}" placeholder="Nama hero"><input class="input" id="eIcon" value="${escAttr(x.icon||'')}" placeholder="URL icon"><label><input type="checkbox" id="eActive" ${x.active!==false?'checked':''}> Aktif</label><label><input type="checkbox" id="eNew" ${x.new?'checked':''}> Badge BARU</label><h3>Replace</h3><div id="rep"></div><button id="addRep">＋ Tambah Replace</button><div style="display:flex;gap:8px;margin-top:10px"><button class="primary" id="saveSkin">💾 Simpan</button><button class="danger" id="deleteSkin">🗑️ Hapus</button></div></div>`;const rep=$('rep');(x.replaces||[]).forEach((r,i)=>addRepRow(rep,r,i));$('addRep').onclick=()=>addRepRow(rep,{label:'Replace baru',url:''});$('saveSkin').onclick=saveSkin;$('deleteSkin').onclick=deleteSkin}
function addRepRow(box,r,i){const d=document.createElement('div');d.className='replace';d.innerHTML=`<input class="input lab" value="${escAttr(r.label||'')}" placeholder="Nama"><input class="input url" value="${escAttr(r.url||'')}" placeholder="https://..."><button class="danger">×</button>`;d.querySelector('button').onclick=()=>d.remove();box.appendChild(d)}
async function saveSkin(){const x=config.skins[selected];x.name=$('eName').value.trim()||x.name;x.hero=$('eHero').value.trim();x.icon=$('eIcon').value.trim();x.active=$('eActive').checked;x.new=$('eNew').checked;x.replaces=[...document.querySelectorAll('#rep .replace')].map(r=>({label:r.querySelector('.lab').value.trim()||'Replace',url:r.querySelector('.url').value.trim()})).filter(r=>r.url);const old=selected;const newId=slug(x.name);if(newId!==old&&!config.skins[newId]){delete config.skins[old];x.id=newId;config.skins[newId]=x;selected=newId}await put('siteConfig',config);render();edit(selected);toast('Skin disimpan')}
async function deleteSkin(){if(!confirm('Hapus skin ini dari konfigurasi?'))return;delete config.skins[selected];await put('siteConfig',config);selected=null;render();$('editor').innerHTML='<div class="empty">Skin dihapus.</div>';toast('Skin dihapus')}
$('addBtn').onclick=()=>$('modal').classList.add('open');$('closeModal').onclick=()=>$('modal').classList.remove('open');$('createSkin').onclick=async()=>{const name=$('newName').value.trim();if(!name)return toast('Nama skin wajib diisi');const id=slug(name);if(config.skins[id])return toast('Skin sudah ada');config.skins[id]={id,name,hero:$('newHero').value.trim(),icon:$('newIcon').value.trim(),active:$('newActive').checked,new:$('newBadge').checked,replaces:$('newUrl').value.trim()?[{label:$('newLabel').value.trim()||'Default',url:$('newUrl').value.trim()}]:[]};await put('siteConfig',config);$('modal').classList.remove('open');render();edit(id);toast('Skin baru ditambahkan')};$('search').oninput=render;
function settingsRender(){const s=config.settings;const fields=[['requestFree','Request Free'],['requestPaid','Request Berbayar'],['youtube','YouTube'],['tutorial','Link Tutorial'],['channel','WhatsApp Channel'],['whatsapp','Nomor WhatsApp Report'],['skipPrice','Harga Skip Link'],['notice','Teks notifikasi upload']];$('settingsForm').innerHTML=fields.map(([k,l])=>`<div class="setting"><label>${l}</label><input class="input sf" data-k="${k}" value="${escAttr(s[k]??'')}"></div>`).join('')+`<label><input type="checkbox" id="skipEnabled" ${s.skipEnabled?'checked':''}> Tampilkan bagian Skip Link</label>`}
$('saveSettings').onclick=async()=>{document.querySelectorAll('.sf').forEach(i=>config.settings[i.dataset.k]=i.value.trim());config.settings.skipEnabled=$('skipEnabled').checked;await put('siteConfig',config);toast('Pengaturan link disimpan')};
$('seedBtn').onclick=async()=>{if(!confirm('Sinkronkan ulang 175 skin dari HTML awal? Perubahan link yang sudah kamu buat akan tertimpa.'))return;config.skins=Object.fromEntries(seed.map(x=>[x.id,x]));await put('siteConfig',config);render();toast('Skin lama disinkronkan')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const skins=b.dataset.tab==='skins';$('skinsTab').style.display=skins?'block':'none';$('settingsTab').style.display=skins?'none':'block';if(!skins)settingsRender()});
async function loadClicks(){try{const d=await get('linkClicks');$('statClicks').textContent=Object.values(d||{}).reduce((n,x)=>n+Number(x?.count||0),0).toLocaleString('id-ID')}catch{}}
function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function escAttr(x){return esc(x).replace(/"/g,'&quot;')}
load();
</script></body></html>
